<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova aba</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/newtab.css" />
  </head>
  <body class="is-locked">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="shell">
      <header class="top">
        <div class="project">
          <div class="brand" id="brand"></div>
          <div class="project-text">
            <span class="eyebrow">Projeto em foco</span>
            <h1 id="project" class="project-name"></h1>
          </div>
        </div>
        <div class="top-right">
          <div id="rates" class="rates" aria-label="Cotações de hoje em reais"></div>
          <div class="legend" aria-label="Legenda de prioridade">
            <span class="prio-high"><i></i>Alta</span>
            <span class="prio-medium"><i></i>Média</span>
            <span class="prio-low"><i></i>Baixa</span>
          </div>
          <div class="clock">
            <span id="clock" class="mono"></span>
            <span id="today-label" class="eyebrow"></span>
          </div>
          <button id="eye" class="eye-btn" aria-pressed="false"></button>
        </div>
      </header>
      <div class="board">
        <aside id="quotes" class="quotes" aria-label="Frases para persistir"></aside>
        <main id="days" class="days"></main>
      </div>
    </div>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
