<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extreminder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <!-- Bloqueado -->
    <section id="view-locked" class="view view-locked">
      <div class="locked-brand" id="locked-logo"></div>
      <h1>Extreminder</h1>
      <p>Projeto e tarefas estão cifrados.<br />Digite o código de acesso para continuar.</p>
      <button id="unlock" class="btn btn-primary"></button>
    </section>

    <!-- Principal -->
    <section id="view-main" class="view" hidden>
      <header class="bar">
        <div class="bar-brand"><span id="bar-logo"></span><strong>Extreminder</strong></div>
        <div class="bar-actions">
          <button id="open-settings" class="icon-btn" aria-label="Classificadores e backup" title="Classificadores e backup"></button>
          <button id="lock" class="icon-btn" aria-label="Trancar" title="Trancar"></button>
        </div>
      </header>

      <label class="field project-field">
        <span class="eyebrow">Projeto em foco</span>
        <div class="project-input">
          <span id="project-icon"></span>
          <input id="project" class="input" maxlength="120" placeholder="No que você está focado?" autocomplete="off" />
        </div>
      </label>

      <nav id="day-tabs" class="day-tabs" role="tablist" aria-label="Dias"></nav>

      <form id="add-form" class="add-form">
        <input id="task-text" class="input" maxlength="200" placeholder="Nova tarefa…" autocomplete="off" required />
        <div class="add-row">
          <div class="prio-picker" role="radiogroup" aria-label="Prioridade">
            <label class="prio-high"><input type="radio" name="priority" value="high" /><i></i>Alta</label>
            <label class="prio-medium"><input type="radio" name="priority" value="medium" checked /><i></i>Média</label>
            <label class="prio-low"><input type="radio" name="priority" value="low" /><i></i>Baixa</label>
          </div>
          <button type="button" id="tag-picker" class="tag-picker"></button>
          <button type="submit" class="btn btn-primary add-btn" aria-label="Adicionar tarefa" id="add-btn"></button>
        </div>
      </form>

      <div class="list-head">
        <span id="list-count" class="eyebrow"></span>
        <button id="sort-prio" class="link-btn"></button>
      </div>
      <div class="list-scroll">
        <ul id="task-list" class="task-list"></ul>
      </div>
    </section>

    <!-- Classificadores e backup -->
    <section id="view-settings" class="view" hidden>
      <header class="bar">
        <button id="back" class="icon-btn" aria-label="Voltar"></button>
        <strong class="bar-title">Classificadores</strong>
        <span></span>
      </header>
      <p class="hint">Use classificadores para agrupar tarefas por contexto — ex.: IFPI, Pessoal, Startup.</p>
      <form id="tag-form" class="tag-form">
        <input id="tag-name" class="input" maxlength="24" placeholder="Nome do classificador" autocomplete="off" required />
        <div id="tag-colors" class="tag-colors" role="radiogroup" aria-label="Cor"></div>
        <button type="submit" class="btn btn-primary">Criar</button>
      </form>
      <ul id="tag-list" class="tag-list"></ul>

      <div class="backup">
        <span class="eyebrow">Backup</span>
        <p class="hint">O arquivo exportado não é cifrado — guarde em local seguro.</p>
        <div class="backup-actions">
          <button id="export" class="btn btn-ghost"></button>
          <button id="import" class="btn btn-ghost"></button>
          <input id="import-file" type="file" accept="application/json" hidden />
        </div>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
